
name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: machu-picchu-monkey/package-lock.json

      - name: Install dependencies
        working-directory: machu-picchu-monkey
        run: npm ci

      - name: Run tests
        working-directory: machu-picchu-monkey
        run: npm test

      - name: Build game
        working-directory: machu-picchu-monkey
        run: npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p pages/class-01
          mkdir -p pages/machu-picchu-monkey
          cp -R class-01/. pages/class-01/
          cp -R machu-picchu-monkey/dist/. pages/machu-picchu-monkey/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
